name: go_jo_user_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  cached_network_image: ^3.2.3

  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3

dev_dependencies:
