name: go_jo_user_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.18.1
  cached_network_image: ^3.2.3
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.2.0
  dartz: ^0.10.1
  firebase_auth: ^6.1.1
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  get_it: ^9.0.5
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.2
  cloud_firestore: ^6.0.3
  modal_progress_hud_nsn: ^0.5.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  skeletonizer: ^2.1.1
  supabase_flutter: ^2.10.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon/app.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/gif/
    - assets/images/google.jpg
    - assets/images/2023_Facebook_icon.svg.png
    - assets/images/apple.png
    - assets/images/map_image.png
    - assets/gif/airline-185.gif
    - assets/images/app_icon/app.png
